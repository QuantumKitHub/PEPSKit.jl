steps:
  - label: "Julia {{matrix.julia}} -- {{matrix.queue}} / {{matrix.group}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-test#v1:
          test_args: "{{matrix.group}}"
      - JuliaCI/julia-coverage#v1:
          dirs:
            - src
            - ext
    agents:
      queue: "{{matrix.queue}}"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 120
    matrix:
      setup:
        julia:
          - "1.10"
          - "1.13"
        queue:
          - "cuda"
          - "rocm"
        group:
          - "boundarymps"
          - "bondenv"
          - "bp"
          - "compress"
          - "ctmrg"
          - "gradients"
          - "timeevol"
          - "toolbox"
          - "utility"

